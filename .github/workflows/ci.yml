name: CI

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

# A newer push to a pull request supersedes the run for the older one. Each push to main
# gets a group of its own, so no run on main is cancelled, running or waiting.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  terms:
    name: Terms
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The image by digest, so a retagged image can't change what runs. The tag says which it is.
    container: swift:6.3.3@sha256:1038d54c80063f5cdfabc4560990c30af64b5de8ebf28161deb22ca4ad5db866
    env:
      REPO_CHECK: Tools/RepoChecks/.build/debug/repo-check
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          # The whole history, so a pull request's base branch is there to compare with.
          fetch-depth: 0
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: Tools/RepoChecks/.build
          key: repo-checks-${{ runner.os }}-swift-6.3.3-${{ hashFiles('Tools/RepoChecks/Package.resolved') }}-${{ hashFiles('Tools/RepoChecks/Package.swift') }}
          restore-keys: repo-checks-${{ runner.os }}-swift-6.3.3-
      - name: Build the repository checks and their tests
        run: swift build --package-path Tools/RepoChecks --build-tests -Xswiftc -warnings-as-errors
      - name: Check the docs and comments for ruled-out terms
        run: $REPO_CHECK terms
      - name: Check that the workflows pin their actions and images and limit their jobs
        run: $REPO_CHECK workflows
      # The container runs as root, so ShellCheck installs without sudo if the image lacks it.
      - name: Check the shell scripts
        run: |
          command -v shellcheck > /dev/null || { apt-get update && apt-get install -y shellcheck; }
          shellcheck --version
          shellcheck Scripts/*.sh
      - name: Test how the installer reports the catalog update
        run: Scripts/test-install-insteon.sh
      - name: Check that every async test has a time limit
        run: $REPO_CHECK time-limits
      - name: Check that the insteon command leaves device behavior to the libraries
        run: $REPO_CHECK cli-thin
      - name: Check the libraries for unstructured tasks, unchecked Sendable types and real clocks
        run: $REPO_CHECK concurrency
      - name: Check that no credential is written into a string
        run: $REPO_CHECK credentials
      - name: Check that the core, the command and the in-memory modem name no real device
        run: $REPO_CHECK device-neutral
      - name: Check that InsteonCore's public API matches its list
        run: $REPO_CHECK public-api
      # Each allow-list only shrinks: a pull request may remove entries but not add them. An
      # entry is its key columns; its reason may be reworded.
      - name: Check that no allow-list grows
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: $REPO_CHECK allowlist-growth --base "origin/${BASE_REF}"
      - name: Test the checks
        run: swift test --package-path Tools/RepoChecks --skip-build

  macos:
    name: macOS
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      # Use the runner's newest Xcode, and so its newest Swift, rather than its default.
      - name: Select Xcode
        run: sudo xcode-select --switch "$(ls -d /Applications/Xcode_*.app | grep -iv beta | sort -V | tail -n 1)"
      - name: Show the Swift version
        run: swift --version
      # Warnings fail the build here rather than in Package.swift, so they don't affect apps
      # that depend on the package. The tests are built too, so a warning in a test fails as
      # well. An import of a module a target doesn't depend on fails too, so the insteon
      # command can't reach past InsteonCore.
      - name: Build
        run: swift build --build-tests --explicit-target-dependency-import-check error -Xswiftc -warnings-as-errors
      # The tests built in the step before, with the same flags.
      - name: Test
        run: swift test --skip-build
      - name: Build optional server
        run: swift build --package-path Packages/InsteonServer --build-tests --explicit-target-dependency-import-check error -Xswiftc -warnings-as-errors
      - name: Test optional server
        run: swift test --package-path Packages/InsteonServer --skip-build
      - name: Build documentation
        run: Scripts/build-docs.sh

  ios:
    name: iOS
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      # Use the runner's newest Xcode, and so its newest Swift, rather than its default.
      - name: Select Xcode
        run: sudo xcode-select --switch "$(ls -d /Applications/Xcode_*.app | grep -iv beta | sort -V | tail -n 1)"
      - name: Show the Swift version
        run: swift --version
      # The package declares iOS, where SerialPort isn't available, so check that everything
      # else builds there. xcodebuild has no check of imports against a package's target
      # dependencies; the macOS and Linux builds make it.
      - name: Build
        run: xcodebuild build -scheme swift-insteon-Package -destination 'generic/platform=iOS Simulator'

  linux:
    name: Linux
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # The image by digest, so a retagged image can't change what runs. The tag says which it is.
    container: swift:6.3.3@sha256:1038d54c80063f5cdfabc4560990c30af64b5de8ebf28161deb22ca4ad5db866
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Build
        run: swift build --build-tests --explicit-target-dependency-import-check error -Xswiftc -warnings-as-errors
      - name: Test
        run: swift test --skip-build
      - name: Build optional server
        run: swift build --package-path Packages/InsteonServer --build-tests --explicit-target-dependency-import-check error -Xswiftc -warnings-as-errors
      - name: Test optional server
        run: swift test --package-path Packages/InsteonServer --skip-build
      - name: Build documentation
        run: Scripts/build-docs.sh
