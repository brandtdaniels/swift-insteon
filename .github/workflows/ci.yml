name: CI

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

jobs:
  terms:
    name: Terms
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The whole history, so a pull request's base branch is there to compare with.
          fetch-depth: 0
      - name: Check the docs and comments for ruled-out terms
        run: python3 Scripts/check-terms.py
      - name: Check that the insteon command leaves device behavior to the libraries
        run: python3 Scripts/check-cli-thin.py
      # The allow-list only shrinks: a pull request may remove entries but not add them.
      - name: Check that the allow-list doesn't grow
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          list=Scripts/check-cli-thin-allowlist.txt
          if ! git cat-file -e "origin/${BASE_REF}:${list}" 2>/dev/null; then
            echo "The base branch has no allow-list yet, so there's nothing to compare."
            exit 0
          fi
          added=$(git diff --no-color --unified=0 "origin/${BASE_REF}" -- "$list" | grep -E '^\+[^+#]' || true)
          if [ -n "$added" ]; then
            echo "These lines were added to $list, which may only lose lines:"
            echo "$added"
            echo "Move the code into the libraries instead of allowing it."
            exit 1
          fi
          echo "The allow-list didn't grow."
      - name: Test the check
        run: python3 -m unittest discover -s Scripts/tests -v

  macos:
    name: macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      # Use the runner's newest Xcode, and so its newest Swift, rather than its default.
      - name: Select Xcode
        run: sudo xcode-select --switch "$(ls -d /Applications/Xcode_*.app | grep -iv beta | sort -V | tail -n 1)"
      - name: Show the Swift version
        run: swift --version
      # Warnings fail the build here rather than in Package.swift, so they don't affect apps
      # that depend on the package.
      - name: Build
        run: swift build -Xswiftc -warnings-as-errors
      - name: Test
        run: swift test
      - name: Build documentation
        run: Scripts/build-docs.sh

  ios:
    name: iOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      # Use the runner's newest Xcode, and so its newest Swift, rather than its default.
      - name: Select Xcode
        run: sudo xcode-select --switch "$(ls -d /Applications/Xcode_*.app | grep -iv beta | sort -V | tail -n 1)"
      - name: Show the Swift version
        run: swift --version
      # The package declares iOS, where SerialPort isn't available, so check that everything
      # else builds there.
      - name: Build
        run: xcodebuild build -scheme swift-insteon-Package -destination 'generic/platform=iOS Simulator'

  linux:
    name: Linux
    runs-on: ubuntu-latest
    container: swift:6.3.3
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: swift build -Xswiftc -warnings-as-errors
      - name: Test
        run: swift test
      - name: Build documentation
        run: Scripts/build-docs.sh
