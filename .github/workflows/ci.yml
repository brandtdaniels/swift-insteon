name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  macos:
    name: macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: swift build
      - name: Test
        run: swift test
      - name: Build documentation
        run: |
          mkdir -p .build/symbol-graphs
          swift build --target InsteonMessage \
            -Xswiftc -emit-symbol-graph \
            -Xswiftc -emit-symbol-graph-dir -Xswiftc "$PWD/.build/symbol-graphs"
          xcrun docc convert Packages/InsteonMessage/Sources/InsteonMessage/InsteonMessage.docc \
            --additional-symbol-graph-dir "$PWD/.build/symbol-graphs" \
            --fallback-display-name InsteonMessage \
            --fallback-bundle-identifier com.brandtdaniels.InsteonMessage \
            --output-path .build/docs/InsteonMessage.doccarchive \
            --warnings-as-errors

  linux:
    name: Linux
    runs-on: ubuntu-latest
    container: swift:6.1
    steps:
      - uses: actions/checkout@v4
      - name: Test
        run: swift test
