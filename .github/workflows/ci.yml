name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  macos:
    name: macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: swift build
      - name: Test
        run: swift test
      - name: Build documentation
        run: >
          xcodebuild docbuild
          -scheme InsteonMessage
          -destination 'generic/platform=macOS'
          -derivedDataPath .build/docs
          OTHER_DOCC_FLAGS="--warnings-as-errors"

  linux:
    name: Linux
    runs-on: ubuntu-latest
    container: swift:6.1
    steps:
      - uses: actions/checkout@v4
      - name: Test
        run: swift test
